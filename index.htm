        const tmp = document.createElement('canvas');
        tmp.width = dw;
        tmp.height = dh;

        const tg = tmp.getContext('2d', { willReadFrequently: true });

        tg.imageSmoothingEnabled = false;

        tg.drawImage(img, 0, 0, dw, dh);

        let imageData;
        try {
          imageData = tg.getImageData(0, 0, dw, dh);
        } catch (e) {
          return;
        }

        const d = imageData.data;

        for (let i = 0; i < d.length; i += 4) {
          const alpha = d[i + 3];

          if (alpha === 0) {
            d[i + 3] = 0;
            continue;
          }

          const red = d[i];
          const green = d[i + 1];
          const blue = d[i + 2];

          if (red === 0 && green === 0 && blue === 0) {
            d[i] = 0;
            d[i + 1] = 0;
            d[i + 2] = 0;
          } else {
            d[i] = 255;
            d[i + 1] = 255;
            d[i + 2] = 255;
          }

          d[i + 3] = 255;
        }

        tg.putImageData(imageData, 0, 0);

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tmp, dx, dy);
        ctx.restore();
      }

      function exportCode2() {
        const W = Math.round(screenW);
        const H = Math.round(screenH);
        if (W <= 0 || H <= 0) return;

        if (!confirm('确认电显宽' + W + '像素，高' + H + '像素？\n代码只在SSD1306单色电显测试过，不保证其它电显可用。\n\n所有图形会合并到单一图层，暂不支持拆分图形；\n所有图形除纯黑和透明部份外，一律显示为白色；\n背景和可变内容将不会导出。\n\n如果电显画面异常，请尝试调整像素渲染方向和顺序。')) return;

        const isWhite = c => {
          if (!c) return false;
          const s = String(c).trim().toLowerCase();
          if (s === 'transparent' || s === 'dynamic') return false;
          if (s === '#000000' || s === '#000' || s === 'black') return false;
          if (s.replace(/\s/g, '') === 'rgb(0,0,0)') return false;
          return true;
        };

        const off = document.createElement('canvas');
        off.width = W;
        off.height = H;
        const og = off.getContext('2d', { willReadFrequently: true });

        og.fillStyle = '#000000';
        og.fillRect(0, 0, W, H);

        for (const s of shapes) {
          if (!s.visible) continue;

          if (s.type === 'image') {
            drawImageForExport2(og, s);
            continue;
          }

          if (s.type === 'text') {
            if (isDynamicText(s)) continue;

            if (!isWhite(s.color)) continue;

            og.save();
            og.font = '600 ' + s.fontSize + 'px ' + (s.font || FONTS.sans);
            og.textBaseline = 'bottom';
            og.textAlign = s.align || 'left';
            og.fillStyle = '#ffffff';
            og.fillText(s.text, s.x, s.y);
            og.restore();
            continue;
          }

          const tracePath = () => {
            og.beginPath();
            if (s.type === 'rect') og.rect(s.x, s.y, s.w, s.h);
            else og.ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, s.h / 2, 0, 0, Math.PI * 2);
          };

          if (isWhite(s.color)) {
            tracePath();
            og.fillStyle = '#ffffff';
            og.fill();
          }
          if (s.outline && isWhite(s.outlineColor || s.color)) {
            tracePath();
            og.strokeStyle = '#ffffff';
            og.lineWidth = s.strokeWidth || outlineWidth;
            og.stroke();
          }
        }

        const px = og.getImageData(0, 0, W, H).data;
        const parts = [];

        if (!export2Horizontal) {
          const pages = Math.ceil(H / 8);

          for (let p = 0; p < pages; p++) {
            for (let x = 0; x < W; x++) {
              let byte = 0;

              for (let bit = 0; bit < 8; bit++) {
                const y = p * 8 + bit;

                if (y < H && px[(y * W + x) * 4] >= 128) {
                  byte |= export2MSB ? (0x80 >> bit) : (1 << bit);
                }
              }

              parts.push('0x' + byte.toString(16).padStart(2, '0'));
            }
          }
        } else {
          const groups = Math.ceil(W / 8);

          for (let y = 0; y < H; y++) {
            for (let gx = 0; gx < groups; gx++) {
              let byte = 0;

              for (let bit = 0; bit < 8; bit++) {
                const x = gx * 8 + bit;

                if (x < W && px[(y * W + x) * 4] >= 128) {
                  byte |= export2MSB ? (0x80 >> bit) : (1 << bit);
                }
              }

              parts.push('0x' + byte.toString(16).padStart(2, '0'));
            }
          }
        }

        const lines = [];
        //export c++ code
        lines.push(`//Example wiring - depends on your hardware specs`);
        lines.push(`//Check for pinouts at: https://docs.arduino.cc/hardware/`);
        lines.push(`//接线示例，因开发板型号而异`);
        lines.push(`//具体可前往：https://docs.arduino.cc/hardware/`);
        lines.push(`//搜索您的开发板型号，并查看Pinout`);
        lines.push(`//SSD1306 pin SDA --- Arduino Nano pin A4`);
        lines.push(`//SSD1306 pin SCL --- Arduino Nano pin A5`);
        lines.push(`//SSD1306 pin VCC --- Arduino Nano pin 3V3`);
        lines.push(`//SSD1306 pin GND --- Arduino Nano pin GND`);
        lines.push(``);

        lines.push(`#include "ssd1306.h"`);
        lines.push(`#include <PCM.h>`);
        lines.push(``);

        lines.push(`const unsigned char graphics[] PROGMEM = {`);
        lines.push(`  //Pixel code`);
        lines.push(`  //这是像素代码：如果您不用SSD1306电显，可以只用这块代码。`);
        lines.push(`  ${parts.join(', ')}`);
        lines.push(`};`);
        lines.push(``);

        lines.push(`static void draw() {`);
        lines.push(`  ssd1306_drawBitmap(0, 0, ${screenW}, ${screenH}, graphics);`);
        lines.push(`}`);
        lines.push(``);

        lines.push(`void setup() {`);
        lines.push(`  ssd1306_${screenW}x${screenH}_i2c_init();`);
        lines.push(`}`);
        lines.push(``);

        lines.push(`void loop() {`);
        lines.push(`  draw();`);
        lines.push(`}`);
        lines.push(``);

        const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lcd-cpp-' + new Date().toISOString().slice(0, 10) + '.ino';
        a.click();
        URL.revokeObjectURL(url);
      }

      const fileInput = document.getElementById('fileInput');
      document.getElementById('importBtn').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const incoming = Array.isArray(parsed) ? parsed : parsed.shapes;
            if (!Array.isArray(incoming)) throw new Error('bad format');

            applyPickerColor(colorPickers.bg, parsed.bgColor);
            screenW = parsed.screenW;
            screenWInput.value = String(screenW);
            screenH = parsed.screenH;
            screenHInput.value = String(screenH);

            const fallback = { rect: counters.rect, oval: counters.oval, text: counters.text };

            const loaded = [];
            for (const s of incoming) {
              if (!s || (s.type !== 'rect' && s.type !== 'oval' && s.type !== 'image' && s.type !== 'text')) continue;

              const isOutline = s.outline === true;
              const importedColor = typeof s.color === 'string' ? s.color : '#5b8cff';
              const importedOutlineColor = typeof s.outlineColor === 'string' ? s.outlineColor : null;

              const newShape = {
                id: uid++,
                type: s.type,
                name: (typeof s.name === 'string' && s.name.trim())
                  ? s.name
                  : (s.type === 'rect' ? '长方形' + (++fallback.rect) : s.type === 'oval' ? '椭圆形' + (++fallback.oval) : '文字' + (++fallback.text)),
                x: Number(s.x) || 0,
                y: Number(s.y) || 0,
                w: Math.max(0, Number(s.w) || 0),
                h: Math.max(0, Number(s.h) || 0),
                color: importedColor,
                visible: s.visible !== false,
                outline: isOutline,
                strokeWidth: Number(s.strokeWidth) > 0 ? Number(s.strokeWidth) : 3,
                outlineColor: importedOutlineColor || (isOutline ? importedColor : outlineColor),
                group: s.group || null
              };

              if (s.type === 'image') {
                newShape.src = typeof s.src === 'string' ? s.src : '';
                newShape.fileName = typeof s.fileName === 'string' ? s.fileName : '';
              }

              if (s.type === 'text') {
                newShape.text = typeof s.text === 'string' ? s.text : '';
                newShape.fontSize = Number(s.fontSize) || 28;
                newShape.font = normalizeFont(s.font);
                newShape.align = ['left', 'center', 'right'].includes(s.align) ? s.align : 'left';
              }

              loaded.push(newShape);
            }

            shapes.length = 0;
            shapes.push(...loaded);

            ['rect', 'oval', 'image', 'text'].forEach(t => {
              let max = 0;
              loaded.filter(s => s.type === t).forEach(s => {
                const m = String(s.name).match(/(\d+)\s*$/);
                max = Math.max(max, m ? parseInt(m[1], 10) : 1);
              });
              counters[t] = Math.max(max, loaded.filter(s => s.type === t).length);
            });

            selectedId = null;
            renderLayerList(); render();
          } catch (err) {
            alert('导入失败！请确认文件格式正确。');
          }
          fileInput.value = '';
        };
        reader.readAsText(file);
      });

      /* ---------- dropdown menus ---------- */
      const dropdownWraps = document.querySelectorAll('.file-menu-wrap');

      function closeAllDropdowns() {
        dropdownWraps.forEach(w => {
          w.classList.remove('open');
          const b = w.querySelector('[aria-haspopup="true"]');
          if (b) b.setAttribute('aria-expanded', 'false');
        });
      }

      dropdownWraps.forEach(wrap => {
        const btn = wrap.querySelector('[aria-haspopup="true"]');
        btn.addEventListener('click', () => {
          const wasOpen = wrap.classList.contains('open');
          closeAllDropdowns();
          if (!wasOpen) {
            wrap.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
          }
        });
      });

      document.querySelectorAll('.file-menu').forEach(menu => {
        menu.addEventListener('click', e => {
          if (e.target.closest('.menu-item')) closeAllDropdowns();
        });
      });

      window.addEventListener('pointerdown', e => {
        if (!e.target.closest('.file-menu-wrap')) closeAllDropdowns();
      });
      window.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllDropdowns(); });

      /* ---------- keyboard ---------- */
      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        const k = e.key.toLowerCase();

        if (e.ctrlKey || e.metaKey) {
          if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
          if (k === 'y') { e.preventDefault(); redo(); return; }
          if (k === 'c') { copySelected(false); e.preventDefault(); return; }
          if (k === 'x') { copySelected(true); e.preventDefault(); return; }
          if (k === 'v') { paste(); e.preventDefault(); return; }
          return;
        }

        const arrows = { arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0] };
        if (arrows[e.key.toLowerCase()]) {
          const s = getShape(selectedId);
          if (s) {
            e.preventDefault();
            const step = e.shiftKey ? 10 : 1;
            s.x += arrows[e.key.toLowerCase()][0] * step;
            s.y += arrows[e.key.toLowerCase()][1] * step;
            render();
            renderLayerList();
          }
          return;
        }

        if (k === 'v') setTool('select');
        else if (k === 'r') setTool('rectOutline');
        else if (k === 'o') setTool('ovalOutline');
        else if (k === 't') setTool('textFixed');
        else if (k === 'escape') { selectedId = null; renderLayerList(); render(); }
        else if (k === 'delete') {
          const idx = shapes.findIndex(s => s.id === selectedId);
          if (idx >= 0) {
            e.preventDefault();
            shapes.splice(idx, 1);
            selectedId = null;
            renderLayerList();
            render();
            pushHistory();
          }
        }
      });

      /* ---------- warn on refresh if changed ---------- */
      window.addEventListener('beforeunload', function (e) {
        if (!hasChanges) return;

        e.preventDefault();
        e.returnValue = '';
      });

      /* ---------- initialise ---------- */
      resize();
      renderLayerList();
      pushHistory(true);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          shapes.forEach(s => {
            if (s.type === 'text') {
              Object.assign(s, measureText(s));
            }
          });

          render();
          renderLayerList();
        });
      }

      function hideLoadingOverlay() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
          overlay.classList.add('hidden');
        }
      }

      if (document.readyState === 'complete') {
        hideLoadingOverlay();
      } else {
        window.addEventListener('load', hideLoadingOverlay);
      }

      alert('【已知明显问题】\n- 在一些设备导出的代码，中文部分会变成乱码\n- 使用触屏时，部分图形编辑功能不可用\n\n欢迎试用《仙全铁显示屏工具》！\n如有疑问或建议，请在仙全铁作品评论区或Github代码库留言～\n此工具暂未适配手机画面，建议用电脑开启。\n\n此工具使用生成式AI技术辅助创作。');
    })();
  </script>
