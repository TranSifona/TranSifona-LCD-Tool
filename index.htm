<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仙全铁显示屏工具</title>
  <style>
    :root {
      --bg: #0c1514;
      --panel: #121b1a;
      --panel-2: #182524;
      --border: #243a37;
      --text: #e8f2f0;
      --muted: #87a39f;
      --accent: #0faa9b;
      --accent-soft: rgba(15, 170, 155, .16);
      --danger: #ff3ca0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: 56px 1fr 46px;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      color: var(--text);
      font: 600 15px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .3px;
      transition: opacity .25s ease, visibility .25s ease;
    }

    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: loadingSpin .8s linear infinite;
    }

    @keyframes loadingSpin {
      to {
        transform: rotate(360deg);
      }
    }

    header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .2px;
      min-width: 190px
    }

    .brand svg {
      display: block
    }

    .brand small {
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      margin-top: 2px
    }

    .divider {
      width: 1px;
      height: 26px;
      background: var(--border)
    }

    .divider-invisible {
      width: 1px;
      height: 26px;
    }

    .history-btns {
      display: flex;
      gap: 4px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px
    }

    .hist-btn {
      width: 32px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
    }

    .hist-btn:hover:not(:disabled) {
      color: var(--text);
      background: rgba(255, 255, 255, .05)
    }

    .hist-btn:active:not(:disabled) {
      color: var(--accent);
      background: var(--accent-soft)
    }

    .hist-btn:disabled {
      opacity: .3;
      cursor: default
    }

    .align-btn {
      width: 32px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
    }

    .align-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .05);
    }

    .align-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(111, 125, 255, .35);
    }

    .tools {
      display: flex;
      gap: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 600 12.5px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 7px 13px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .tool-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .05)
    }

    .tool-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(111, 125, 255, .35)
    }

    .tool-btn kbd {
      font: 600 9.5px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 4px;
      background: rgba(0, 0, 0, .25)
    }

    .tool-btn.active kbd {
      color: var(--accent);
      border-color: rgba(111, 125, 255, .4)
    }

    .spacer {
      flex: 1
    }

    .colors {
      display: flex;
      align-items: center;
      gap: 8px
    }

    #fontSelect {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: 600 12px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 7px 10px;
      cursor: pointer;
      outline: none;
    }

    #fontSelect:hover {
      border-color: #33405a;
    }

    #outlineWidthInput {
      width: 50px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: 600 12px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 7px 10px;
      outline: none;
    }

    #outlineWidthInput:hover,
    #outlineWidthInput:focus {
      border-color: #33405a;
    }

    .preset {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
      outline: 1px solid rgba(255, 255, 255, .15);
      outline-offset: 0;
    }

    .preset:hover {
      transform: scale(1.18)
    }

    .preset.active {
      border-color: #fff;
      transform: scale(1.12)
    }

    .color-well {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      background:
        conic-gradient(#f66, #fc3, #6d6, #4cc, #66f, #c4f, #f66);
    }

    .color-well input {
      position: absolute;
      inset: -8px;
      width: 200%;
      height: 200%;
      cursor: pointer;
      opacity: 0
    }

    .color-display {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      cursor: pointer;
      outline: 1px solid rgba(255, 255, 255, .15);
      transition: transform .12s ease;
    }

    .color-display.dynamic-active::after {
      content: "线";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 11px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    .color-display:hover {
      transform: scale(1.1);
    }

    .color-dropdown {
      min-width: auto;
      padding: 10px;
    }

    .bg-color-menu-wrap {
      position: relative;
    }

    .bg-color-menu-wrap .color-dropdown {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
    }

    .bg-color-menu-wrap.open .color-dropdown {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 26px);
      gap: 8px;
      justify-content: center;
    }

    .color-grid .preset {
      width: 26px;
      height: 26px;
    }

    .color-mode-select {
      margin-top: 8px;
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: 600 12px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 5px 7px;
      cursor: pointer;
      outline: none;
    }

    .color-mode-select:hover,
    .color-mode-select:focus {
      border-color: #33405a;
    }

    .transparent-preset {
      background:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
      background-color: #fff;
    }

    .color-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600
    }

    .header-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font: 600 12px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .header-btn:hover {
      color: var(--accent);
      border-color: rgba(111, 125, 255, .5);
      background: var(--accent-soft);
    }

    .file-menu-wrap {
      position: relative
    }

    .file-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 158px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
      z-index: 20;
    }

    .file-menu-wrap.open .file-menu {
      opacity: 1;
      visibility: visible;
      transform: none
    }

    .file-menu hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 3px 4px
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: 600 12.5px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      transition: background .12s ease, color .12s ease;
    }

    .file-menu .menu-item.active {
      color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(111, 125, 255, .35);
    }

    .file-menu .menu-item.active svg {
      color: var(--accent);
    }

    .menu-item svg {
      color: var(--muted);
      transition: color .12s ease;
      flex: none
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, .07)
    }

    .menu-item:hover svg {
      color: var(--accent)
    }

    .menu-item.danger:hover {
      background: rgba(255, 107, 122, .1);
      color: var(--danger)
    }

    .menu-item.danger:hover svg {
      color: var(--danger)
    }

    #export2OrientationLabel,
    #export2BitOrderLabel {
      color: var(--accent);
      font-weight: 700;
    }

    .screen-size-block {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 8px 10px;
      font: 600 12.5px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    .screen-size-title {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .screen-size-title svg {
      color: var(--muted);
      flex: none;
    }

    .screen-size-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 23px;
      /* aligns under the text (14px icon + 9px gap) */
    }

    .screen-size-inputs .color-label {
      font-size: 11px;
    }

    .screen-size-inputs input {
      width: 64px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: 600 12px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 5px 7px;
      outline: none;
    }

    .screen-size-inputs input:hover,
    .screen-size-inputs input:focus {
      border-color: #33405a;
    }

    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      overflow: hidden;
      min-height: 0
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
    }

    .panel-head h2 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted)
    }

    .count-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 20px;
      padding: 2px 9px;
    }

    .panel-head-right {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .order-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font: 700 10px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: .5px;
      padding: 4px 9px;
      border-radius: 20px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .order-toggle:hover {
      color: var(--text);
      border-color: #33405a
    }

    .order-toggle svg {
      transition: transform .25s ease;
      flex: none
    }

    .order-toggle.reversed svg {
      transform: rotate(180deg)
    }

    .order-tag {
      font-size: 10px;
      color: var(--muted);
      padding: 2px 16px;
      letter-spacing: .5px;
      opacity: .8
    }

    .order-tag.bottom {
      margin-top: auto
    }

    #layerList {
      list-style: none;
      overflow-y: auto;
      padding: 4px 8px 8px;
      flex: 1;
    }

    #layerList::-webkit-scrollbar {
      width: 8px
    }

    #layerList::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px
    }

    #layerList::-webkit-scrollbar-thumb:hover {
      background: #2c4a45
    }

    .layer {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
      padding: 8px 8px 8px 10px;
      margin-bottom: 3px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .12s ease, border-color .12s ease;
    }

    .layer-line1 {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .layer-line2 {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      padding-left: 23px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layer.selected .layer-line2 {
      color: #aab3ff;
    }

    .layer:hover {
      background: rgba(255, 255, 255, .045)
    }

    .layer.selected {
      background: var(--accent-soft);
      border-color: rgba(111, 125, 255, .45)
    }

    .layer.hidden-layer {
      opacity: .45
    }

    .layer-line2.tooltip {
      position: relative;
      cursor: pointer;
      overflow: visible;
    }

    .layer-line2.tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #564c61;
      color: #e8f2f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .layer-line2.tooltip:hover::after {
      opacity: 1;
    }

    .dynamic-select-wrap {
      margin-top: 6px;
      padding-left: 23px;
    }

    .dynamic-select {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: 600 12px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 5px 7px;
      cursor: pointer;
      outline: none;
    }

    .dynamic-select:hover,
    .dynamic-select:focus {
      border-color: #33405a;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .18) inset
    }

    .licon {
      color: var(--muted);
      display: flex;
      flex: none
    }

    .layer.selected .licon {
      color: var(--accent)
    }

    .lname {
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1
    }

    .lbtns {
      display: flex;
      gap: 2px;
      opacity: .35;
      transition: opacity .12s ease
    }

    .layer:hover .lbtns,
    .layer.selected .lbtns {
      opacity: 1
    }

    .lbtns button {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s ease;
    }

    .lbtns button:hover {
      background: rgba(255, 255, 255, .09);
      color: var(--text)
    }

    .lbtns button[data-action="del"]:hover {
      color: var(--danger);
      background: rgba(255, 107, 122, .12)
    }

    .empty-layers {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 34px 20px;
      line-height: 1.6;
    }

    .canvas-wrap {
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      background: radial-gradient(1200px 600px at 70% -10%, rgba(15, 170, 155, .07), transparent 60%),
        #10141b;
    }

    #cv {
      display: block;
      touch-action: none
    }

    .canvas-hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      color: var(--muted);
      transition: opacity .3s ease;
    }

    .canvas-hint.gone {
      opacity: 0
    }

    .canvas-hint .hint-icon {
      opacity: .5
    }

    .canvas-hint p {
      font-size: 13.5px;
      font-weight: 500
    }

    .canvas-hint small {
      font-size: 11.5px;
      opacity: .75
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: .3px;
    }
  </style>
</head>

<body>

  <div id="loadingOverlay" role="status" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div>加载中……</div>
  </div>

  <!-- ======= TOP MENU ======= -->
  <header>
    <div class="brand">
      <img src="./tsfn-logo.png" width="26" height="26" />
      <span lang-name="app-title">仙全铁显示屏工具</span>
    </div>

    <div class="divider"></div>

    <div class="history-btns">
      <button class="hist-btn" id="undoBtn" title="撤销 (Ctrl+Z)">
        <svg width="14" height="14" viewBox="0 0 16 16">
          <path d="M6.5 3.5 3 7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M3 7h6a4 4 0 0 1 4 4v1.5" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" />
        </svg>
      </button>
      <button class="hist-btn" id="redoBtn" title="重做 (Ctrl+Y 或 Ctrl+Shift+Z)">
        <svg width="14" height="14" viewBox="0 0 16 16">
          <path d="M9.5 3.5 13 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M13 7H7a4 4 0 0 0-4 4v1.5" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="tools" id="toolbar">
      <button class="tool-btn active" data-tool="select" title="选择画板图形 (V)">
        <svg width="14" height="14" viewBox="0 0 16 16">
          <path d="M3 1.5 13 7.8 8.6 8.9 6.4 13.5 3 1.5Z" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linejoin="round" />
        </svg>
        选择 <kbd>V</kbd>
      </button>

      <div class="file-menu-wrap">
        <button class="tool-btn" data-tool="shape" data-dropdown aria-haspopup="true" aria-expanded="false"

  <script>
    (function () {
      'use strict';

      /* ---------- states ---------- */
      let scale = 0.5;

      let screenW = 2000;
      let screenH = 400;

      const shapes = [];
      let selectedId = null;
      let tool = 'select';
      let bgColor = 'transparent';
      let fillColor = '#564c61';
      let outlineColor = '#0faa9b';

      let layersTopFirst = true;

      let uid = 1;
      const counters = { rect: 0, oval: 0, image: 0, text: 0 };
      let routeMapStnCount = 0;
      let mainRouteW = 0;
      let textWMax = 0;
      let routeX = 0;
      let routeY = 0;
      let routeW = 0;
      let routeH = 0;

      let drag = null;
      let draft = null;
      let clipboard = null;
      let hasChanges = false;
      const history = [];
      let historyIndex = -1;
      const MAX_HISTORY = 50;

      const FONT_STACKS = {
        sans:
          '"Noto Sans SC", "Noto Sans CJK SC", "Noto Sans CJK TC", "Noto Sans CJK JP", "Noto Sans CJK KR", ' +
          '"Source Han Sans SC", "Source Han Sans TC", "Source Han Sans JP", "Source Han Sans KR", ' +
          '"PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", ' +
          '"Malgun Gothic", sans-serif',

        serif:
          '"Noto Serif SC", "Noto Serif CJK SC", "Noto Serif CJK TC", "Noto Serif CJK JP", "Noto Serif CJK KR", ' +
          '"Source Han Serif SC", "Source Han Serif TC", "Source Han Serif JP", "Source Han Serif KR", ' +
          '"Songti SC", "Songti TC", "SimSun", "MS PMincho", "MS Mincho", serif'
      };

      const FONTS = FONT_STACKS;

      let currentFont = 'sans';

      function normalizeFont(font) {
        const v = String(font || '').toLowerCase().replace(/["']/g, '');

        const isSerif =
          /(^|,)\s*serif/.test(v) ||
          /noto serif|source han serif|songti|simsun|mincho/.test(v);

        return isSerif ? 'serif' : 'sans';
      }

      function getFontFamily(font) {
        const key = normalizeFont(font);
        return FONT_STACKS[key] || FONT_STACKS.sans;
      }

      let outlineWidth = 10;

      const fontSelect = document.getElementById('fontSelect');
      fontSelect.addEventListener('change', e => {
        currentFont = normalizeFont(e.target.value);

        const s = getShape(selectedId);
        if (s && s.type === 'text' && s.font !== currentFont) {
          s.font = currentFont;
          Object.assign(s, measureText(s));
          render();
          renderLayerList();
          pushHistory();
        }
      });

      const outlineWidthInput = document.getElementById('outlineWidthInput');

      outlineWidthInput.addEventListener('input', () => {
        const v = parseFloat(outlineWidthInput.value);
        if (!Number.isFinite(v)) return;

        outlineWidth = Math.max(1, Math.min(100, v));

        const s = getShape(selectedId);
        if (s && s.outline) {
          s.strokeWidth = outlineWidth;
          render();
        }
      });

      outlineWidthInput.addEventListener('change', () => {
        outlineWidthInput.value = String(outlineWidth);

        const s = getShape(selectedId);
        if (s && s.outline) {
          pushHistory();
        }
      });

      /* ---------- change screen size ---------- */
      const screenWInput = document.getElementById('screenWInput');
      const screenHInput = document.getElementById('screenHInput');

      function updateScreenSize() {
        const w = parseInt(screenWInput.value, 10);
        const h = parseInt(screenHInput.value, 10);
        if (Number.isFinite(w) && w >= 0) screenW = w;
        if (Number.isFinite(h) && h >= 0) screenH = h;
        render();
        renderLayerList();
      }

      screenWInput.addEventListener('input', updateScreenSize);
      screenHInput.addEventListener('input', updateScreenSize);

      /* ---------- change canvas scale ---------- */
      const scaleInput = document.getElementById('scaleInput');

      scaleInput.addEventListener('input', () => {
        const v = parseFloat(scaleInput.value);
        if (!Number.isFinite(v) || v <= 0) return;
        scale = Math.max(0.05, Math.min(5, v / 100));
        resize();
      });

      scaleInput.addEventListener('change', () => {
        scaleInput.value = String(Math.round(scale * 100));
      });

      /* ---------- dom ---------- */
      const canvas = document.getElementById('cv');
      const g = canvas.getContext('2d');
      const wrap = document.getElementById('canvasWrap');
      const listEl = document.getElementById('layerList');
      const countEl = document.getElementById('layerCount');
      const emptyEl = document.getElementById('emptyMsg');
      const hintEl = document.getElementById('canvasHint');
      const colorInput = document.getElementById('colorInput');
      const outlineColorInput = document.getElementById('outlineColorInput');

      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      undoBtn.addEventListener('click', undo);
      redoBtn.addEventListener('click', redo);

      /* ---------- icons ---------- */
      const I = {
        rect: '<svg width="13" height="13" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
        oval: '<svg width="13" height="13" viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
        image: '<svg width="13" height="13" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.5" cy="5.5" r="1.5" fill="currentColor" stroke="none"/><path d="M2 11l3.5-3.5L9 11l2.5-2.5L14 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
        text: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7V4h16v3" /><path d="M9 20h6" /><path d="M12 4v16" /></svg>',
        up: '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 3v10M8 3 4 7M8 3l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        down: '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 13V3M8 13l-4-4M8 13l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        eye: '<svg width="13" height="13" viewBox="0 0 16 16"><path d="M1.2 8S3.7 3.6 8 3.6 14.8 8 14.8 8 12.3 12.4 8 12.4 1.2 8 1.2 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>',
        eyeOff: '<svg width="13" height="13" viewBox="0 0 16 16"><path d="M1.2 8S3.7 3.6 8 3.6 14.8 8 14.8 8 12.3 12.4 8 12.4 1.2 8 1.2 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 13.5 13.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
        copy: '<svg width="12" height="12" viewBox="0 0 16 16"><rect x="6" y="6" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 6V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
        trash: '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M2.5 4h11M6.5 2h3M4 4l.7 9.3A1.5 1.5 0 0 0 6.2 14.7h3.6a1.5 1.5 0 0 0 1.5-1.4L12 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
      };

      /* ---------- helpers ---------- */
      const getShape = id => shapes.find(s => s.id === id);

      const DYNAMIC_TEXT = '未知';

      const DYNAMIC_TEXT_VALUES = new Set([
        DYNAMIC_TEXT,
        'nextTxZh',
        'nextTxEn',
        'nextZh',
        'nextEn',
        'destZh',
        'destEn',
        'next2TxZh',
        'next2TxEn',
        'next2Zh',
        'next2En',
        'routeNameZh',
        'routeNameEn',
        'speed'
      ]);

      const isDynamicText = s => {
        return !!(s && s.type === 'text' && DYNAMIC_TEXT_VALUES.has(s.text));
      };

      const getDisplayText = s => {
        return isDynamicText(s) ? '###' : s.text;
      };

      let textAlign = 'left';
      const alignBtns = document.querySelectorAll('#alignTools .align-btn');

      function getTextBox(s) {
        if (!s) return { x: 0, y: 0, w: 0, h: 0 };
        if (s.type !== 'text') return { x: s.x, y: s.y, w: s.w, h: s.h };

        const align = s.align || 'left';
        let x = s.x;

        if (align === 'center') {
          x = s.x - s.w / 2;
        } else if (align === 'right') {
          x = s.x - s.w;
        }

        return { x, y: s.y - s.h, w: s.w, h: s.h };
      }

      function setTextBoxFromAlign(s, boxX, boxY) {
        if (!s || s.type !== 'text') return;

        const align = s.align || 'left';

        if (align === 'right') {
          s.x = boxX + s.w;
        } else if (align === 'center') {
          s.x = boxX + s.w / 2;
        } else {
          s.x = boxX;
        }

        s.y = boxY + s.h;
      }

      function syncAlignUI() {
        const s = getShape(selectedId);

        let align = textAlign;

        if (s && s.type === 'text') {
          align = s.align || 'left';
          textAlign = align;
        }

        alignBtns.forEach(b => {
          b.classList.toggle('active', b.dataset.align === align);
        });
      }

      function applyAlign(align) {
        textAlign = align;

        const s = getShape(selectedId);

        if (s && s.type === 'text') {
          if ((s.align || 'left') === align) {
            syncAlignUI();
            syncPickersToSelectedShape();
            return;
          }

          const box = getTextBox(s);

          s.align = align;

          if (align === 'left') {
            s.x = box.x;
          } else if (align === 'center') {
            s.x = box.x + s.w / 2;
          } else {
            s.x = box.x + s.w;
          }

          renderLayerList();
          render();
          pushHistory();
          return;
        }

        syncAlignUI();
        syncPickersToSelectedShape();
      }

      alignBtns.forEach(b => {
        b.addEventListener('click', () => applyAlign(b.dataset.align));
      });

      const SNAP_DIST = 14;

      function snapEdges(b) {
        const W = canvas.clientWidth, H = canvas.clientHeight;
        if (Math.abs(b.x) < SNAP_DIST) b.x = 0;
        if (Math.abs(b.y) < SNAP_DIST) b.y = 0;
        if (Math.abs(W - (b.x + b.w)) < SNAP_DIST) b.x = W - b.w;
        if (Math.abs(H - (b.y + b.h)) < SNAP_DIST) b.y = H - b.h;
        return b;
      }

      function snapSquare(w, h) {
        const max = Math.max(w, h);
        if (max > 0 && Math.min(w, h) / max > 0.9) return [max, max];
        return [w, h];
      }

      function norm(d) {
        return {
          x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1),
          w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0)
        };
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
      }

      function hitHandle(px, py) {
        const s = getShape(selectedId);
        if (!s || !s.visible) return null;

        const b = s.type === 'text' ? getTextBox(s) : s;

        const pad = 4;
        const tol = 7;

        const corners = {
          nw: [b.x - pad, b.y - pad],
          ne: [b.x + b.w + pad, b.y - pad],
          sw: [b.x - pad, b.y + b.h + pad],
          se: [b.x + b.w + pad, b.y + b.h + pad]
        };

        for (const key in corners) {
          const [hx, hy] = corners[key];

          if (Math.abs(px - hx) <= tol && Math.abs(py - hy) <= tol) {
            const anchors = {
              nw: [b.x + b.w, b.y + b.h],
              ne: [b.x, b.y + b.h],
              sw: [b.x + b.w, b.y],
              se: [b.x, b.y]
            };

            return { key, ax: anchors[key][0], ay: anchors[key][1] };
          }
        }

        return null;
      }

      function handleCursor(key) {
        return (key === 'nw' || key === 'se') ? 'nwse-resize' : 'nesw-resize';
      }

      function hitTest(px, py) {
        for (let i = shapes.length - 1; i >= 0; i--) {
          const s = shapes[i];
          if (!s.visible) continue;

          if (s.type === 'rect' || s.type === 'image' || s.type === 'text') {
            const b = s.type === 'text' ? getTextBox(s) : s;

            if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
              return s;
            }
          } else {
            const rx = s.w / 2, ry = s.h / 2;
            if (rx <= 0 || ry <= 0) continue;

            const dx = (px - (s.x + rx)) / rx;
            const dy = (py - (s.y + ry)) / ry;

            if (dx * dx + dy * dy <= 1) return s;
          }
        }

        return null;
      }

      function cloneShape(s) {
        return { ...s };
      }

      function copySelected(cut) {
        const s = getShape(selectedId);
        if (!s) return;
        clipboard = cloneShape(s);
        if (cut) {
          shapes.splice(shapes.indexOf(s), 1);
          selectedId = null;
          renderLayerList(); render();
          pushHistory();
        }
      }

      function paste() {
        if (!clipboard) return;
        counters[clipboard.type]++;
        const s = cloneShape(clipboard);
        s.id = uid++;
        s.name = (s.type === 'rect' ? 'Rectangle ' : s.type === 'oval' ? 'Oval ' : 'Text ') + counters[s.type];
        s.x += 12; s.y += 12;
        clipboard.x = s.x; clipboard.y = s.y;
        shapes.push(s);
        selectedId = s.id;
        renderLayerList(); render();
        pushHistory();
      }

      function copyLayer(id) {
        const li = listEl.querySelector('li.layer[data-id="' + id + '"]');
        if (!li) return;

        const code = Array.from(li.querySelectorAll('.layer-line2'))
          .map(el => el.textContent.trim())
          .filter(Boolean)
          .join('\n');

        if (!code) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).catch(() => { });
        } else {
          const ta = document.createElement('textarea');
          ta.value = code;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();

          try {
            document.execCommand('copy');
          } catch (err) { }

          ta.remove();
        }
      }

      function pushHistory(initial = false) {
        if (!initial) hasChanges = true;

        history.length = historyIndex + 1;
        history.push(JSON.stringify({ shapes, selectedId }, (key, value) => (key === 'img' ? undefined : value)));
        if (history.length > MAX_HISTORY) history.shift();
        historyIndex = history.length - 1;
        updateHistoryButtons();
      }

      function restoreHistory(entry) {
        const data = JSON.parse(entry);
        shapes.length = 0;
        shapes.push(...data.shapes);
        selectedId = data.selectedId;
        renderLayerList(); render();
        updateHistoryButtons();
      }

      function undo() {
        if (historyIndex <= 0) return;
        historyIndex--;
        restoreHistory(history[historyIndex]);
      }

      function redo() {
        if (historyIndex >= history.length - 1) return;
        historyIndex++;
        restoreHistory(history[historyIndex]);
      }

      function updateHistoryButtons() {
        undoBtn.disabled = historyIndex <= 0;
        redoBtn.disabled = historyIndex >= history.length - 1;
      }

      /* ---------- canvas sizing ---------- */
      function resize() {
        const r = wrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(r.width * dpr));
        canvas.height = Math.max(1, Math.round(r.height * dpr));
        canvas.style.width = r.width + 'px';
        canvas.style.height = r.height + 'px';
        g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
        render();
      }
      new ResizeObserver(resize).observe(wrap);

      /* ---------- rendering ---------- */
      function drawGrid(w, h) {
        g.fillStyle = 'rgba(255,255,255,0.25)';
        for (let x = 0; x < w; x += 50)
          for (let y = 0; y < h; y += 50)
            g.fillRect(x, y, 5, 5);
      }

      function drawFrame(w, h) {
        if (bgColor && bgColor !== 'transparent') {
          g.fillStyle = bgColor;
          g.fillRect(0, 0, w, h);
        }

        if (bgColor && bgColor === 'transparent') {
          g.strokeStyle = 'rgba(200,0,100,0.5)';
          g.lineWidth = 10;
          g.strokeRect(0, 0, w, h);
          g.font = '50px ' + FONTS.sans;
          g.textBaseline = 'top';
          g.globalAlpha = 1;
          g.fillStyle = 'rgb(200, 0, 100)';
          g.fillText("显示屏可见范围", 50, 50);
          g.font = '36px ' + FONTS.sans;
          g.fillText("操作方法：先在顶部菜单选择图形，然后点击画板任意位置添加图形。", 50, 150);
          g.fillText("提示：点击画板上的图形后，可以拖动角落调整大小，调整时按Shift键可以保持宽高比。", 50, 220);
        }
      }

      function drawShape(s) {

        if (s.type === 'image') {
          if (!(s.img instanceof HTMLImageElement) && s.src) {
            const im = new Image();
            im.onload = () => { s.img = im; render(); };
            im.src = s.src;
          }
          if (s.img && s.img.complete && s.img.naturalWidth > 0) {
            g.globalAlpha = 1;
            g.drawImage(s.img, s.x, s.y, s.w, s.h);
          }
          return;
        }

        if (s.type === 'text') {
          g.save();

          g.font = '600 ' + s.fontSize + 'px ' + getFontFamily(s.font);
          g.textBaseline = 'bottom';
          g.textAlign = s.align || 'left';
          g.globalAlpha = 1;
          g.fillStyle = resolveColor(s.color);

          let stnNameLimit = 0.95 * (mainRouteW / routeMapStnCount);
          if (s.group === 'routeMap' && textWMax > stnNameLimit) {
            let tempScale = stnNameLimit / textWMax;
            g.scale(tempScale, 1);
            g.fillText(getDisplayText(s), s.x / tempScale, s.y);
          }
          else
            g.fillText(getDisplayText(s), s.x, s.y);

          g.restore();
          return;
        }

        g.beginPath();

        if (s.type === 'rect') {
          g.rect(s.x, s.y, s.w, s.h);
        } else if (s.type === 'oval') {
          g.ellipse(
            s.x + s.w / 2,
            s.y + s.h / 2,
            s.w / 2,
            s.h / 2,
            0,
            0,
            Math.PI * 2
          );
        }

        g.globalAlpha = 1;

        if (s.outline) {
          if (s.color && s.color !== 'transparent') {
            g.fillStyle = resolveColor(s.color);
            g.fill();
          }
          g.lineWidth = s.strokeWidth || outlineWidth;
          g.strokeStyle = resolveColor(s.outlineColor || s.color);
          g.stroke();
        } else {
          g.fillStyle = resolveColor(s.color);
          g.fill();
          g.lineWidth = 2.5;
          g.strokeStyle = resolveColor(s.color);
          g.stroke();
        }
      }

      function drawSelection(s) {
        const b = s.type === 'text' ? getTextBox(s) : s;
        const p = 5;

        g.save();

        g.strokeStyle = '#ccc';
        g.lineWidth = 2.5;
        g.setLineDash([12, 8]);
        g.strokeRect(b.x - p, b.y - p, b.w + p * 2, b.h + p * 2);
        g.setLineDash([]);

        const hs = 10;
        g.fillStyle = '#fff';
        g.strokeStyle = '#0faa9b';
        g.lineWidth = 2.5;

        [
          [b.x - p, b.y - p],
          [b.x + b.w + p, b.y - p],
          [b.x - p, b.y + b.h + p],
          [b.x + b.w + p, b.y + b.h + p]
        ].forEach(([hx, hy]) => {
          g.beginPath();
          g.rect(hx - hs / 2, hy - hs / 2, hs, hs);
          g.fill();
          g.stroke();
        });

        g.restore();
      }

      function render() {
        const w = canvas.clientWidth / scale, h = canvas.clientHeight / scale;
        g.clearRect(0, 0, w, h);
        drawGrid(w, h);
        drawFrame(screenW, screenH);

        for (const s of shapes)
          if (s.group === 'routeMap' && s.type === 'text' && s.w > textWMax)
            textWMax = s.w;

        for (const s of shapes)
          if (s.visible)
            drawShape(s);

        if (draft) {
          const n = snapEdges(norm(draft));

          g.save();

          g.beginPath();

          if (draft.type === 'rect') {
            g.rect(n.x, n.y, n.w, n.h);
          } else if (draft.type === 'oval') {
            g.ellipse(
              n.x + n.w / 2,
              n.y + n.h / 2,
              n.w / 2,
              n.h / 2,
              0,
              0,
              Math.PI * 2
            );
          }

          if (draft.color && draft.color !== 'transparent') {
            g.globalAlpha = 0.4;
            g.fillStyle = resolveColor(draft.color);
            g.fill();
          }
          g.globalAlpha = 0.9;
          g.strokeStyle = resolveColor(draft.outlineColor || draft.color);

          g.lineWidth = draft.strokeWidth || outlineWidth;
          g.setLineDash([6, 4]);
          g.stroke();
          g.setLineDash([]);

          if (n.w > 2 || n.h > 2) {
            const label = Math.round(n.w) + ' × ' + Math.round(n.h);
            g.font = '600 25px "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
            const tw = g.measureText(label).width;
            const lx = Math.max(5, Math.min(n.x, w - tw - 10));
            const ly = Math.max(20, n.y - 40);

            g.fillStyle = 'rgba(10,13,18,0.8)';
            g.fillRect(lx - 5, ly - 4, tw + 10, 29);

            g.fillStyle = '#c8cfdd';
            g.fillText(label, lx, ly);
          }

          g.restore();
        }

        const sel = getShape(selectedId);
        if (sel && sel.visible) drawSelection(sel);
      }

      /* ---------- layer panel ---------- */
      function renderLayerList() {
        listEl.innerHTML = '';
        const idxs = shapes.map((_, i) => i);
        if (layersTopFirst) idxs.reverse();

        const bgLi = makeBgLayer();
        if (!layersTopFirst) listEl.appendChild(bgLi);

        function getDynamicTextOptionsHTML(s) {
          const opts = [
            { value: 'nextTxZh', label: '1中文提示（行驶中：“下一站”；停车时：“已到達”）' },
            { value: 'nextTxEn', label: '2英文提示（行驶中："Next is"；停车时："Now at"）' },
            { value: 'nextZh', label: '3中文站名（行驶中：前方到站；停车时：当前站）' },
            { value: 'nextEn', label: '4英文站名（行驶中：前方到站；停车时：当前站）' },
            { value: 'destZh', label: '5终点站中文名' },
            { value: 'destEn', label: '6终点站英文名' },
            { value: 'next2TxZh', label: '7中文提示（行驶中：不显示；停车时：“下一站”）' },
            { value: 'next2TxEn', label: '8英文提示（行驶中：不显示；停车时："Next is"）' },
            { value: 'next2Zh', label: '9中文站名（行驶中：不显示；停车时：下一站）' },
            { value: 'next2En', label: '10英文站名（行驶中：不显示；停车时：下一站）' },
            { value: 'routeNameZh', label: '11路线中文名' },
            { value: 'routeNameEn', label: '12路线英文名' },
            { value: 'speed', label: '13速度（km/h）' }
          ];

          const hasKnownValue = opts.some(o => o.value === s.text);

          let html = '<div class="dynamic-select-wrap">';
          html += '<select class="dynamic-select" title="">';

          if (!hasKnownValue) {
            html += `<option value="${s.text}" disabled selected hidden>可变文字，请选择要显示的内容</option>`;
          }

          for (const o of opts) {
            html += `<option value="${o.value}" ${s.text === o.value ? 'selected' : ''}>${o.label}</option>`;
          }

          html += '</select></div>';

          return html;
        }

        for (const i of idxs) {
          const s = shapes[i];
          const li = document.createElement('li');
          li.className = 'layer' + (s.id === selectedId ? ' selected' : '') + (s.visible ? '' : ' hidden-layer');
          li.dataset.id = s.id;

          const roundX = s.x.toFixed(0),
            roundY = s.y.toFixed(0),
            roundW = s.w.toFixed(0),
            roundH = s.h.toFixed(0);

          const hasFill = (s.color && s.color !== 'transparent' && s.type !== 'image');
          const hasShapeFill = (s.color && s.color !== 'transparent' && s.type !== 'image' && s.type !== 'text');
          const hasTextFill = (s.color && s.color !== 'transparent' && s.type === 'text');
          const isFillDynamic = (s.color === 'dynamic');
          const hasOutline = (s.outlineColor && s.outlineColor !== 'transparent' && s.type !== 'image' && s.type !== 'text');
          const isOutlineDynamic = (s.outlineColor === 'dynamic');

          li.innerHTML
            = '<div class="layer-line1">'
            + '<span class="swatch" style="background:' + resolveColor(s.color) + '"></span>'
            + '<span class="licon">' + (s.type === 'rect' ? I.rect : s.type === 'oval' ? I.oval : s.type === 'image' ? I.image : I.text) + '</span>'
            + '<span class="lname">' + s.name + '</span>'
            + '<span class="lbtns">'
            + '<button data-action="copy" data-action="copy" title="复制这些代码">' + I.copy + '</button>'
            + '<button data-action="up" title="移到前一个图层">' + I.up + '</button>'
            + '<button data-action="down" title="移到后一个图层">' + I.down + '</button>'
            + '<button data-action="vis" title="隐藏图层">' + (s.visible ? I.eye : I.eyeOff) + '</button>'
            + '<button data-action="del" title="删除图层">' + I.trash + '</button>'
            + '</span>'
            + '</div>'

            + ((s.type === 'image') ? (`<div class="layer-line2 tooltip" data-tooltip="需要额外代码读取图片文件数据">//需要额外代码，请到文件设置导出JS代码查看。</div>`) : '')
            + ((s.type === 'text') ? (`<div class="layer-line2 tooltip" data-tooltip="需要额外代码对文字排版">//需要额外代码，请到文件设置导出JS代码查看。</div>`) : '')
            + ((isFillDynamic || isOutlineDynamic || isDynamicText(s)) ? (`<div class="layer-line2 tooltip" data-tooltip="需要额外代码读取MTR模组数据">//需要额外代码，请到文件设置导出JS代码查看。</div>`) : '')
            + ((hasTextFill && s.group === 'routeMap' && s.type === 'text') ? (`<div class="layer-line2 tooltip" data-tooltip="需要额外代码读取MTR模组数据">//需要额外代码，请到文件设置导出JS代码查看。</div>`) : '')

            + ((s.type === 'text' && hasTextFill) ? (`<div class="layer-line2 tooltip" data-tooltip="设置字体为Noto ${s.font === 'sans' ? 'Sans' : 'Serif'}">g.setFont(Resources.getSystemFont("Noto ${s.font === 'sans' ? 'Sans' : 'Serif'}")</div>`) : '')
            + ((s.type === 'text' && hasTextFill) ? (`<div class="layer-line2 tooltip" data-tooltip="字体大小${s.fontSize}">.deriveFont(0, ${s.fontSize}));</div>`) : '')

            + (s.type === 'image' ? (`<div class="layer-line2 tooltip" data-tooltip="显示图片（左上x=${roundX}，左上y=${roundY}，宽${roundW}，高${roundH}）">g.drawImage(图片变量（略）, ${roundX}, ${roundY}, ${roundW}, ${roundH}, null);</div>`) : '')

            + (hasFill ? (`<div class="layer-line2 tooltip" data-tooltip="使用颜色${isFillDynamic ? '与路线色一致' : s.color}">g.setColor(Color${isFillDynamic ? '(routeColor' : (`.decode("${s.color}"`)}));</div>`) : '')
            + (hasShapeFill ? (`<div class="layer-line2 tooltip" data-tooltip="填充${s.type === 'rect' ? '长方形' : '椭圆形'}（左上x=${roundX}，左上y=${roundY}，宽${roundW}，高${roundH}）">g.fill${s.type === 'rect' ? 'Rect' : 'Oval'}(${roundX}, ${roundY}, ${roundW}, ${roundH});</div>`) : '')

            + ((s.group !== 'routeMap' && !isDynamicText(s) && hasTextFill) ? (`<div class="layer-line2 tooltip" data-tooltip="显示文字（${s.align === 'left' ? '左' : s.align === 'center' ? '中' : '右'}下x=${roundX}，${s.align === 'left' ? '左' : s.align === 'center' ? '中' : '右'}下y=${roundY}）">AlignText(g, "${s.text}", ${roundX}, ${roundY}, ${screenW}, "${s.align}");</div>`) : '')
            + ((s.group !== 'routeMap' && isDynamicText(s) && hasTextFill) ? (`<div class="layer-line2 tooltip" data-tooltip="显示文字（${s.align === 'left' ? '左' : s.align === 'center' ? '中' : '右'}下x=${roundX}，${s.align === 'left' ? '左' : s.align === 'center' ? '中' : '右'}下y=${roundY}）">AlignText(g, ${s.text}, ${roundX}, ${roundY}, ${screenW}, "${s.align}");</div>`) : '')
            + ((s.group === 'routeMap' && s.type === 'text' && hasTextFill) ? (`<div class="layer-line2 tooltip" data-tooltip="显示文字（${s.align === 'left' ? '左' : s.align === 'center' ? '中' : '右'}下x=${roundX}，${s.align === 'left' ? '左' : s.align === 'center' ? '中' : '右'}下y=${roundY}）">AlignText(g, 车站名称（略）, ${roundX}, ${roundY}, ${screenW}, "${s.align}");</div>`) : '')

            + (hasOutline ? (`<div class="layer-line2 tooltip" data-tooltip="创建轮廓变量myStroke，宽度为${s.strokeWidth}">let myStroke = new BasicStroke(${s.strokeWidth});</div>`) : '')
            + (hasOutline ? (`<div class="layer-line2 tooltip" data-tooltip="使用轮廓变量myStroke">g.setStroke(myStroke);</div>`) : '')
            + (hasOutline ? (`<div class="layer-line2 tooltip" data-tooltip="使用颜色${isOutlineDynamic ? '与路线色一致' : s.outlineColor}">g.setColor(Color${isOutlineDynamic ? '(routeColor' : (`.decode("${s.outlineColor}"`)}));</div>`) : '')
            + (hasOutline ? (`<div class="layer-line2 tooltip" data-tooltip="绘制${s.type === 'rect' ? '长方形' : '椭圆形'}轮廓（左上x=${roundX}，左上y=${roundY}，宽${roundW}，高${roundH}）">g.draw${s.type === 'rect' ? 'Rect' : 'Oval'}(${roundX}, ${roundY}, ${roundW}, ${roundH});</div>`) : '')
            + (isDynamicText(s) ? getDynamicTextOptionsHTML(s) : '')
            ;

          listEl.appendChild(li);
        }

        function makeBgLayer() {
          const li = document.createElement('li');
          li.className = 'layer';
          li.dataset.id = 'bg';
          const col = (bgColor && bgColor !== 'transparent') ? bgColor : 'rgb(200,0,100)';
          const hasBg = (bgColor && bgColor !== 'transparent');
          li.innerHTML
            = '<div class="layer-line1">'
            + '<span class="swatch" style="background:' + col + '"></span>'
            + '<span class="licon">' + I.rect + '</span>'
            + '<span class="lname">显示屏背景</span>'
            + '</div>'
            + (hasBg ? (`<div class="layer-line2 tooltip" data-tooltip="使用颜色${bgColor}">g.setColor(Color.decode("${bgColor}"));</div>`) : '')
            + (hasBg ? (`<div class="layer-line2 tooltip" data-tooltip="填充长方形（左上x=0，左上y=0，宽${screenW}，高${screenH}）">g.fillRect(0, 0, ${screenW}, ${screenH});</div>`) : '')
            ;
          return li;
        }

        if (layersTopFirst) listEl.appendChild(bgLi);

        countEl.textContent = shapes.length + 1;

        document.getElementById('orderTagTop').textContent = layersTopFirst ? '▲ 图层最前' : '▼ 图层最后';
        document.getElementById('orderTagBottom').textContent = layersTopFirst ? '▼ 图层最后' : '▲ 图层最前';

        emptyEl.style.display = shapes.length ? 'none' : 'block';
        hintEl.classList.toggle('gone', shapes.length > 0 || !!draft);

        const selectedLayer = getShape(selectedId);
        if (selectedLayer && selectedLayer.outline) {
          outlineWidthInput.value = String(selectedLayer.strokeWidth || outlineWidth);
        }

        syncAlignUI();
        syncPickersToSelectedShape();

        const selectedTextShape = getShape(selectedId);
        fontSelect.value =
          selectedTextShape && selectedTextShape.type === 'text'
            ? normalizeFont(selectedTextShape.font)
            : currentFont;
      }

      listEl.addEventListener('click', e => {
        const li = e.target.closest('li.layer');
        if (!li) return;
        if (li.dataset.id === 'bg') return;
        if (e.target.closest('.dynamic-select-wrap')) return;

        const id = Number(li.dataset.id);
        const idx = shapes.findIndex(s => s.id === id);
        if (idx < 0) return;
        const btn = e.target.closest('button[data-action]');
        if (btn) {
          const a = btn.dataset.action;

          if (a === 'copy') {
            copyLayer(id);
            return;
          }

          let changed = false;

          if (a === 'up' && idx < shapes.length - 1) {
            [shapes[idx], shapes[idx + 1]] = [shapes[idx + 1], shapes[idx]];
            changed = true;
          }

          if (a === 'down' && idx > 0) {
            [shapes[idx], shapes[idx - 1]] = [shapes[idx - 1], shapes[idx]];
            changed = true;
          }

          if (a === 'vis') {
            shapes[idx].visible = !shapes[idx].visible;
            changed = true;
          }

          if (a === 'del') {
            shapes.splice(idx, 1);
            if (selectedId === id) selectedId = null;
            changed = true;
          }

          renderLayerList();
          render();

          if (changed) pushHistory();
        } else {
          selectedId = id;
          renderLayerList(); render();
        }
      });

      listEl.addEventListener('change', e => {
        const sel = e.target.closest('select.dynamic-select');
        if (!sel) return;

        const li = sel.closest('li.layer');
        if (!li) return;

        const id = Number(li.dataset.id);
        const s = getShape(id);

        if (!s || s.type !== 'text') return;
        if (!isDynamicText(s)) return;

        if (s.text === sel.value) return;

        s.text = sel.value;
        selectedId = id;

        renderLayerList();
        render();
        pushHistory();
      });

      /* ---------- layer order toggle ---------- */
      const orderToggle = document.getElementById('orderToggle');
      orderToggle.addEventListener('click', () => {
        layersTopFirst = !layersTopFirst;
        orderToggle.classList.toggle('reversed', !layersTopFirst);
        document.getElementById('orderLabel').textContent = layersTopFirst ? '图层从前到后' : '图层从后到前';
        orderToggle.title = layersTopFirst
          ? '点击切换排序方式'
          : '点击切换排序方式';
        renderLayerList();
      });

      /* ---------- pointer interaction ---------- */
      canvas.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        const p = getPos(e);
        canvas.setPointerCapture(e.pointerId);

        if (tool === 'rectOutline' || tool === 'ovalOutline') {
          const shapeType = tool === 'rectOutline' ? 'rect' : 'oval';

          draft = {
            type: shapeType,
            color: fillColor,
            outlineColor: outlineColor,
            strokeWidth: outlineWidth,
            x0: p.x,
            y0: p.y,
            x1: p.x,
            y1: p.y
          };

          drag = { mode: 'draw' };
          hintEl.classList.add('gone');
          render();
        } else if (tool === 'textFixed' || tool === 'textDynamic') {
          const isDynamic = tool === 'textDynamic';

          let content;

          if (isDynamic) {
            content = DYNAMIC_TEXT;
          } else {
            content = prompt('输入文字：', '');
            if (content === null || content.trim() === '') return;
            content = content.trim();
          }

          counters.text++;

          const s = {
            id: uid++,
            type: 'text',
            name: '文字' + counters.text,
            x: p.x,
            y: 0,
            text: content,
            color: fillColor,
            fontSize: 75,
            font: currentFont,
            align: textAlign,
            visible: true
          };

          const m = measureText(s);
          s.w = m.w;
          s.h = m.h;
          s.y = p.y + s.h;

          shapes.push(s);
          selectedId = s.id;

          setTool('select');
          renderLayerList();
          render();
          pushHistory();

          return;
        }
        else {
          const h = hitHandle(p.x, p.y);
          if (h) {
            const s = getShape(selectedId);
            drag = { mode: 'resize', ax: h.ax, ay: h.ay, key: h.key, origW: s.w, origH: s.h };
            canvas.style.cursor = handleCursor(h.key);
          }
          else {
            const s = hitTest(p.x, p.y);
            if (s) {
              selectedId = s.id;

              const b = s.type === 'text' ? getTextBox(s) : s;

              drag = {
                mode: 'move',
                dx: p.x - b.x,
                dy: p.y - b.y
              };

              canvas.style.cursor = 'move';
            } else {
              selectedId = null;
              drag = null;
            }
            renderLayerList(); render();
          }
        }
      });

      canvas.addEventListener('pointermove', e => {
        const p = getPos(e);
        if (drag) {
          if (drag.mode === 'draw' && draft) {
            const w0 = p.x - draft.x0, h0 = p.y - draft.y0;
            let w = Math.abs(w0), h = Math.abs(h0);
            [w, h] = snapSquare(w, h);
            draft.x1 = draft.x0 + (w0 < 0 ? -w : w);
            draft.y1 = draft.y0 + (h0 < 0 ? -h : h);
            render();
          } else if (drag.mode === 'resize') {
            const s = getShape(selectedId);
            if (s) {
              const W = canvas.clientWidth, H = canvas.clientHeight;
              const w0 = p.x - drag.ax, h0 = p.y - drag.ay;
              let w = Math.max(2, Math.abs(w0));
              let h = Math.max(2, Math.abs(h0));

              if (e.shiftKey && drag.origW && drag.origH) {
                const ratio = drag.origW / drag.origH;
                if (w / h > ratio) {
                  w = Math.max(2, h * ratio);
                } else {
                  h = Math.max(2, w / ratio);
                }
              }

              if (s.type === 'text') {
                const scaleX = w / (s.w || 1);
                const scaleY = h / (s.h || 1);
                const textScale = Math.max(scaleX, scaleY);

                s.fontSize = Math.max(12, Math.round(s.fontSize * textScale));

                const m = measureText(s);
                s.w = m.w;
                s.h = m.h;

                const boxX = w0 < 0 ? drag.ax - s.w : drag.ax;
                const boxY = h0 < 0 ? drag.ay - s.h : drag.ay;

                setTextBoxFromAlign(s, boxX, boxY);
              } else {
                if (!e.shiftKey) {
                  [w, h] = snapSquare(w, h);

                  if (w0 >= 0) {
                    const t = W - drag.ax;
                    if (Math.abs(W - (drag.ax + w)) < SNAP_DIST && t >= 2) w = t;
                  } else {
                    if (Math.abs(drag.ax - w) < SNAP_DIST && drag.ax >= 2) w = drag.ax;
                  }
                  if (h0 >= 0) {
                    const t = H - drag.ay;
                    if (Math.abs(H - (drag.ay + h)) < SNAP_DIST && t >= 2) h = t;
                  } else {
                    if (Math.abs(drag.ay - h) < SNAP_DIST && drag.ay >= 2) h = drag.ay;
                  }
                }
                s.x = w0 < 0 ? drag.ax - w : drag.ax;
                s.y = h0 < 0 ? drag.ay - h : drag.ay;
                s.w = w;
                s.h = h;
              }
              render();
              renderLayerList();
            }
          } else if (drag.mode === 'move') {
            const s = getShape(selectedId);

            if (s) {
              let boxX = p.x - drag.dx;
              let boxY = p.y - drag.dy;

              const snapped = snapEdges({
                x: boxX,
                y: boxY,
                w: s.w,
                h: s.h
              });

              boxX = snapped.x;
              boxY = snapped.y;

              if (s.type === 'text') {
                setTextBoxFromAlign(s, boxX, boxY);
              } else {
                s.x = boxX;
                s.y = boxY;
              }

              render();
              renderLayerList();
            }
          }
        } else {
          if (tool === 'select') {
            if (hitTest(p.x, p.y))
              canvas.style.cursor = 'move';
            else
              canvas.style.cursor = 'default';
          }
          else if (tool === 'textFixed' || tool === 'textDynamic')
            canvas.style.cursor = 'text';
          else
            canvas.style.cursor = 'crosshair';
        }
      });

      function measureText(s) {
        g.save();

        g.font = '600 ' + s.fontSize + 'px ' + getFontFamily(s.font);
        g.textBaseline = 'top';
        g.textAlign = 'left';

        const m = {
          w: g.measureText(getDisplayText(s)).width,
          h: s.fontSize * 1.2
        };

        g.restore();

        return m;
      }

      function endPointer() {
        if (drag && drag.mode === 'draw' && draft) {
          const n = snapEdges(norm(draft));
          if (n.w >= 4 && n.h >= 4) {
            counters[draft.type]++;

            const s = {
              id: uid++,
              type: draft.type,
              name: '',
              x: n.x,
              y: n.y,
              w: n.w,
              h: n.h,
              color: draft.color,
              outlineColor: draft.outlineColor || outlineColor,
              visible: true,
              outline: true,
              strokeWidth: draft.strokeWidth || outlineWidth
            };

            if (s.type === 'rect')
              s.name = '长方形' + counters[draft.type];
            else if (s.type === 'oval')
              s.name = '椭圆形' + counters[draft.type];
            else if (s.type === 'text')
              s.name = '文字' + counters[draft.type];

            shapes.push(s);
            selectedId = s.id;
            setTool('select');

            pushHistory();
          }
          draft = null;
          renderLayerList(); render();
        }
        else if (drag && (drag.mode === 'move' || drag.mode === 'resize')) {
          pushHistory();
          renderLayerList();
        }

        drag = null;
      }
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', endPointer);

      /* ---------- toolbar ---------- */
      function setTool(t) {
        tool = t;
        const baseTool =
          t === 'rectOutline' ? 'rect' :
            t === 'ovalOutline' ? 'oval' :
              (t === 'textFixed' || t === 'textDynamic') ? 'text' :
                t;

        document.querySelectorAll('.tool-btn').forEach(b => {
          if (b.dataset.tool === 'shape') {
            b.classList.toggle('active', baseTool === 'rect' || baseTool === 'oval');
          } else {
            b.classList.toggle('active', b.dataset.tool === baseTool);
          }
        });

        const menuMap = {
          'rectOutline': 'rectOptionBItem',
          'ovalOutline': 'ovalOptionBItem',
          'textFixed': 'fixedTextItem',
          'textDynamic': 'dynamicTextItem'
        };

        document.querySelectorAll('#shapeMenu .menu-item, #textMenu .menu-item').forEach(item => {
          item.classList.toggle('active', item.id === menuMap[t]);
        });

        canvas.style.cursor =
          (t === 'select') ? 'default' :
            (t === 'textFixed' || t === 'textDynamic') ? 'text' :
              'crosshair';
      }

      document.querySelectorAll('.tool-btn').forEach(b => {
        if (b.hasAttribute('data-dropdown')) return;
        if (b.dataset.tool === 'image') return;
        b.addEventListener('click', () => setTool(b.dataset.tool));
      });

      document.getElementById('rectOptionBItem').addEventListener('click', () => setTool('rectOutline'));
      document.getElementById('ovalOptionBItem').addEventListener('click', () => setTool('ovalOutline'));
      document.getElementById('fixedTextItem').addEventListener('click', () => setTool('textFixed'));
      document.getElementById('dynamicTextItem').addEventListener('click', () => setTool('textDynamic'));

      /* ---------- image input ---------- */
      const imageInput = document.getElementById('imageInput');
      document.querySelector('[data-tool="image"]').addEventListener('click', () => {
        imageInput.click();
      });

      imageInput.addEventListener('change', () => {
        const file = imageInput.files && imageInput.files[0];
        if (!file) return;

        const fileName = file.name;

        const reader = new FileReader();
        reader.onload = () => {
          const dataURL = reader.result;
          const img = new Image();
          img.onload = () => {
            counters.image++;
            let w = img.naturalWidth, h = img.naturalHeight;
            const maxDim = 2000;
            if (w > maxDim || h > maxDim) {
              const s = maxDim / Math.max(w, h);
              w = Math.round(w * s); h = Math.round(h * s);
            }
            const shape = {
              id: uid++,
              type: 'image',
              name: '图片' + counters.image,
              x: 20, y: 20, w, h,
              color: fillColor,
              visible: true,
              outline: false,
              strokeWidth: 2.5,
              fileName: fileName,
              src: dataURL,
              img: img
            };
            shapes.push(shape);
            selectedId = shape.id;
            setTool('select');
            renderLayerList(); render();
            pushHistory();
          };
          img.src = dataURL;
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
      });

      /* ---------- colors ---------- */
      const DYNAMIC = 'dynamic';
      let routeColor = '#0faa9b';
      const resolveColor = c => (c === DYNAMIC ? routeColor : c);

      const PRESETS = ['#0faa9b', '#ff3ca0', '#f5c542', '#9bd65f', '#e8f2f0', '#564c61'];

      const colorPickers = {
        fill: {
          menuId: 'colorMenu',
          wrapId: 'colorMenuWrap',
          displayBtnId: 'colorDisplayBtn',
          colorInputId: 'colorInput',
          get: () => fillColor,
          set: (c) => { fillColor = c; },
          applyToShape: (s, c) => { s.color = c; },
          hasDynamic: true,
          lastColor: '#564c61',
          shapeProp: 'color',
        },
        outline: {
          menuId: 'outlineColorMenu',
          wrapId: 'outlineColorMenuWrap',
          displayBtnId: 'outlineColorDisplayBtn',
          colorInputId: 'outlineColorInput',
          get: () => outlineColor,
          set: (c) => { outlineColor = c; },
          applyToShape: (s, c) => { s.outlineColor = c; },
          hasDynamic: true,
          lastColor: '#564c61',
          shapeProp: 'outlineColor',
        },
        bg: {
          menuId: 'bgColorMenu',
          wrapId: 'bgColorMenuWrap',
          displayBtnId: 'bgColorDisplayBtn',
          colorInputId: 'bgColorInput',
          get: () => bgColor,
          set: (c) => { bgColor = c; },
          applyToShape: null,
          hasDynamic: false,
          shapeProp: null,
        },
      };

      function applyPickerColor(picker, c) {
        if (c !== DYNAMIC && c !== 'transparent') {
          picker.lastColor = c;
        }

        if (picker.applyToShape) {
          const s = getShape(selectedId);
          if (s) {
            picker.applyToShape(s, c);
          }
        }

        updatePickerUI(picker, c);

        render();
        renderLayerList();

        const wrap = document.getElementById(picker.wrapId);
        if (wrap && wrap.classList.contains('open')) {
          wrap.classList.remove('open');

          const trigger = wrap.querySelector('[aria-haspopup="true"]');
          if (trigger) {
            trigger.setAttribute('aria-expanded', 'false');
          }
        }
      }

      function buildColorGrid(menuEl, picker) {
        menuEl.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'color-grid';

        PRESETS.forEach(hex => {
          const b = document.createElement('button');
          b.className = 'preset';
          b.dataset.color = hex;
          b.style.background = hex;
          b.title = hex;
          grid.appendChild(b);
        });

        const label = document.createElement('label');
        label.className = 'color-well';
        label.title = '更多颜色';
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.id = picker.colorInputId;
        inp.value = picker.get() || '#000000';
        label.appendChild(inp);
        grid.appendChild(label);

        const tr = document.createElement('button');
        tr.className = 'preset transparent-preset';
        tr.dataset.color = 'transparent';
        tr.title = '透明';
        grid.appendChild(tr);

        menuEl.appendChild(grid);

        inp.value = (picker.get() === DYNAMIC)
          ? (picker.lastColor || PRESETS[0])
          : (picker.get() || '#000000');

        if (picker.hasDynamic) {
          const sel = document.createElement('select');
          sel.className = 'color-mode-select';
          sel.id = picker.menuId + 'ModeSelect';
          sel.innerHTML =
            '<option value="fixed">固定颜色</option>' +
            '<option value="dynamic">跟随路线色</option>';
          sel.value = (picker.get() === DYNAMIC) ? 'dynamic' : 'fixed';
          menuEl.appendChild(sel);
        }
      }

      Object.values(colorPickers).forEach(picker => {
        const menu = document.getElementById(picker.menuId);
        buildColorGrid(menu, picker);

        menu.addEventListener('click', e => {
          const btn = e.target.closest('.preset');
          if (!btn) return;
          const hadSelection = picker.applyToShape && !!getShape(selectedId);
          applyPickerColor(picker, btn.dataset.color);
          if (hadSelection) pushHistory();
        });

        const inp = document.getElementById(picker.colorInputId);
        inp.addEventListener('input', e => applyPickerColor(picker, e.target.value));
        inp.addEventListener('change', () => {
          if (picker.applyToShape && getShape(selectedId)) pushHistory();
        });

        if (picker.hasDynamic) {
          const sel = document.getElementById(picker.menuId + 'ModeSelect');
          sel.addEventListener('change', () => {
            const hadSelection = picker.applyToShape && !!getShape(selectedId);
            if (sel.value === 'dynamic') applyPickerColor(picker, DYNAMIC);
            else applyPickerColor(picker, picker.lastColor || PRESETS[0]);
            if (hadSelection) pushHistory();
          });
        }
      });

      document.getElementById('bgColorDisplayBtn').addEventListener('click', e => {
        e.stopPropagation();
        const wrap = document.getElementById('bgColorMenuWrap');
        const btn = document.getElementById('bgColorDisplayBtn');
        const wasOpen = wrap.classList.contains('open');
        wrap.classList.toggle('open', !wasOpen);
        btn.setAttribute('aria-expanded', String(!wasOpen));
      });

      window.addEventListener('pointerdown', e => {
        if (!e.target.closest('#bgColorMenuWrap')) {
          const wrap = document.getElementById('bgColorMenuWrap');
          if (wrap && wrap.classList.contains('open')) {
            wrap.classList.remove('open');
            document.getElementById('bgColorDisplayBtn')
              .setAttribute('aria-expanded', 'false');
          }
        }
      });

      /* ---------- D color label ---------- */
      function syncDynamicBadge(picker) {
        if (!picker.hasDynamic || !picker.shapeProp) return;

        const btn = document.getElementById(picker.displayBtnId);
        if (!btn) return;

        const s = getShape(selectedId);
        const showD = !!(s && s[picker.shapeProp] === DYNAMIC);

        btn.classList.toggle('dynamic-active', showD);
      }

      function updatePickerUI(picker, c) {
        const isDynamic = c === DYNAMIC;
        const isTransparent = c === 'transparent';

        picker.set(c);

        if (!isDynamic && !isTransparent) {
          picker.lastColor = c;
        }

        const input = document.getElementById(picker.colorInputId);
        if (input) {
          if (isDynamic) {
            input.value = picker.lastColor || PRESETS[0];
          } else if (!isTransparent) {
            input.value = c;
          }
        }

        document.querySelectorAll('#' + picker.menuId + ' .preset').forEach(p => {
          p.classList.toggle(
            'active',
            !isDynamic &&
            p.dataset.color.toLowerCase() === String(c).toLowerCase()
          );
        });

        const btn = document.getElementById(picker.displayBtnId);
        if (btn) {
          btn.classList.toggle('transparent-preset', isTransparent);
          btn.style.background = isTransparent
            ? ''
            : isDynamic
              ? routeColor
              : c;
        }

        if (picker.hasDynamic) {
          const sel = document.getElementById(picker.menuId + 'ModeSelect');
          if (sel) {
            sel.value = isDynamic ? 'dynamic' : 'fixed';
          }
        }

        syncDynamicBadge(picker);
      }

      function syncPickersToSelectedShape() {
        const s = getShape(selectedId);

        Object.values(colorPickers).forEach(picker => {
          if (!picker.shapeProp) {
            syncDynamicBadge(picker);
            return;
          }

          if (!s || s[picker.shapeProp] === undefined) {
            syncDynamicBadge(picker);
            return;
          }

          updatePickerUI(picker, s[picker.shapeProp]);
        });
      }

      /* ---------- clear ---------- */
      document.getElementById('clearBtn').addEventListener('click', () => {
        if (shapes.length === 0) return;

        const ok = confirm(
          '您的作品可能无法复原，建议您先导出画板工程文件。\n确定现在清空画板？'
        );
        if (!ok) return;

        shapes.length = 0;
        selectedId = null;
        counters.rect = 0; counters.oval = 0; counters.image = 0; counters.text = 0;
        renderLayerList(); render();
        pushHistory();
      });

      /* ---------- export / import ---------- */
      document.getElementById('exportBtn').addEventListener('click', () => {
        const data = JSON.stringify(
          { app: 'TranSifona LCD Tool', version: 0.1, shapes, bgColor, screenW, screenH },
          (key, value) => (key === 'img' ? undefined : value),
          2
        );
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lcd-canvas-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      /* ---------- RMG ---------- */
      function goToRMG() {
        const ok = confirm('您即将前往RMG，该工具并非仙全铁作品。\n请支持RMG原作者：Chito Wong\nhttps://github.com/wongchito');
        if (!ok) return;
        window.open('https://railmapgen.org/?app=rmg', '_blank', 'noopener');
      }

      /* ---------- import from RMG ---------- */
      const rmgFileInput = document.getElementById('rmgFileInput');

      function importFromRMG() {
        const ok = alert('导入路线图仅供效果预览，\n实际游戏中的路线色和站名取决于MTR数据。\n\n暂不能显示支线；\n暂不能修改路线图位置和外观，以下除外：\n游戏内路线图站名颜色取决于画板最左边的站名颜色。');
        rmgFileInput.click();
      }
      document.getElementById('importFromRmgBtn').addEventListener('click', importFromRMG);

      rmgFileInput.addEventListener('change', () => {
        const file = rmgFileInput.files && rmgFileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            importRmgRouteMap(JSON.parse(reader.result));
          } catch (err) {
            alert('导入失败！请确认文件格式正确。');
          }
          rmgFileInput.value = '';
        };
        reader.readAsText(file);
      });

      function importRmgRouteMap(data) {
        const stnList = data.stn_list || {};

        /* "theme" → routeColor (first color-like entry, e.g. "#e60013") */
        const theme = Array.isArray(data.theme) ? data.theme : [];
        const themeColor = theme.find(v => typeof v === 'string' && v.trim().startsWith('#'));
        if (themeColor) routeColor = themeColor.trim();

        /* linestart → children[0] → children[0] → … until lineend */
        const startKey = 'linestart';
        const isEnd = k => k === 'lineend';
        const stationIds = [];
        const seen = new Set();
        let cur = stnList[startKey] && Array.isArray(stnList[startKey].children)
          ? stnList[startKey].children[0] : null;
        while (cur && !isEnd(cur) && !seen.has(cur)) {
          seen.add(cur);

          };

          shapes.push(s);
